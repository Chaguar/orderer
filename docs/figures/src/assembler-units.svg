<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <!-- theme -->
  <defs>
    <marker id="arrow-digests" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-digests" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-batches" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-batches" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blocks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-blocks" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-requests" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-requests" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- The assembler node -->
  <text class="group-label" x="532" y="40">Assembler A1</text>
  <rect class="group frame" x="200" y="52" width="665" height="613" rx="14"/>

  <!-- Row 0: the decision reporter -->
  <rect class="node" x="390" y="93" width="170" height="44"/>
  <text class="node-label-small" x="475" y="121">Decision reporter</text>

  <!-- The collator tells the reporter the committed decision after each block it appends; the reporter reports it to every consenter -->
  <line class="flow digests" x1="475" y1="181" x2="475" y2="139" marker-end="url(#arrow-digests)"/>
  <text class="flow-label digests start small" x="483" y="164">committed decision</text>
  <path class="flow requests" d="M388,115 H70 V166" marker-end="url(#arrow-requests)"/>
  <text class="flow-label requests small" x="294" y="100">reports</text>

  <!-- Outside the node -->
  <rect class="group consensus" x="15" y="168" width="110" height="252" rx="14"/>
  <text class="group-label" x="70" y="446">Consensus</text>
  <rect class="node" x="30" y="183" width="80" height="44"/><text class="node-label" x="70" y="213">C1</text>
  <rect class="node" x="30" y="242" width="80" height="44"/><text class="node-label" x="70" y="272">C2</text>
  <rect class="node" x="30" y="301" width="80" height="44"/><text class="node-label" x="70" y="331">C3</text>
  <rect class="node" x="30" y="360" width="80" height="44"/><text class="node-label" x="70" y="390">C4</text>
  <rect class="node" x="15" y="588" width="110" height="44"/><text class="node-label-small" x="70" y="616">Batchers</text>
  <rect class="node" x="895" y="183" width="100" height="44"/><text class="node-label-small" x="945" y="211">Clients</text>

  <!-- Row 1: the decision path and the output -->
  <rect class="node" x="215" y="183" width="140" height="44"/>
  <text class="node-label-small" x="285" y="211">BA replicator</text>
  <rect class="node" x="405" y="183" width="140" height="44"/>
  <text class="node-label-small" x="475" y="211">Collator</text>
  <path class="ledger" d="M600,186 v38 a25,7 0 0 0 50,0 v-38"/>
  <ellipse class="ledger" cx="625" cy="186" rx="25" ry="7"/>
  <text class="note" x="625" y="252">ledger</text>
  <rect class="node" x="693" y="183" width="150" height="44"/>
  <text class="node-label-small" x="768" y="211">Deliver service</text>

  <!-- Row 2: the index -->
  <rect class="node" x="255" y="345" width="440" height="60"/>
  <text class="node-label-small" x="475" y="371">Index</text><text class="note" x="475" y="392">⟨shard, primary⟩ partitions</text>

  <!-- Row 3: the prefetcher's two loops -->
  <rect class="node" x="255" y="465" width="160" height="60"/>
  <text class="node-label-small" x="335" y="501">Stream loop</text>
  <rect class="node" x="535" y="465" width="160" height="60"/>
  <text class="node-label-small" x="615" y="501">Request loop</text>
  <rect class="group frame" x="243" y="453" width="464" height="84" rx="10"/>
  <text class="note start" x="715" y="499">Prefetcher</text>

  <!-- Row 4: the batch fetcher -->
  <rect class="node" x="255" y="580" width="440" height="60"/>
  <text class="node-label-small" x="475" y="606">Batch fetcher</text><text class="note" x="475" y="627">streams and on-demand pulls from the batchers</text>

  <!-- Decisions: C1 -> BA replicator -> collator -->
  <line class="flow digests" x1="110" y1="205" x2="213" y2="205" marker-end="url(#arrow-digests)"/>
  <text class="flow-label digests small" x="164" y="190">decisions</text>
  <line class="flow digests" x1="355" y1="205" x2="403" y2="205" marker-end="url(#arrow-digests)"/>
  <text class="flow-label digests small" x="379" y="190">BAs</text>

  <!-- Blocks: collator -> ledger -> Deliver service -> clients -->
  <line class="flow blocks" x1="545" y1="205" x2="598" y2="205" marker-end="url(#arrow-blocks)"/>
  <text class="flow-label blocks small" x="571" y="190">append</text>
  <line class="flow blocks" x1="650" y1="205" x2="691" y2="205" marker-end="url(#arrow-blocks)"/>
  <line class="flow blocks" x1="843" y1="205" x2="893" y2="205" marker-end="url(#arrow-blocks)"/>
  <text class="flow-label blocks small" x="868" y="190">blocks</text>

  <!-- The collator asks the index for a batch by its batchID, and gets the batch back -->
  <line class="flow requests" x1="450" y1="229" x2="450" y2="343" marker-end="url(#arrow-requests)"/>
  <text class="flow-label requests end small" x="442" y="295">PopOrWait(batchID)</text>
  <line class="flow batches" x1="500" y1="343" x2="500" y2="229" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches start small" x="508" y="295">batch</text>

  <!-- Streamed batches: batchers -> batch fetcher -> stream loop -> index -->
  <line class="flow batches" x1="125" y1="610" x2="253" y2="610" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches small" x="162" y="601">batches</text>
  <line class="flow batches" x1="335" y1="578" x2="335" y2="527" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches end small" x="327" y="557">Replicate</text>
  <line class="flow batches" x1="335" y1="463" x2="335" y2="407" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches end small" x="327" y="440">Put</text>

  <!-- On-demand: index -> request loop -> batch fetcher, and the batch back into the index -->
  <line class="flow requests" x1="590" y1="407" x2="590" y2="463" marker-end="url(#arrow-requests)"/>
  <text class="flow-label requests end small" x="582" y="440">batchID</text>
  <line class="flow batches" x1="640" y1="463" x2="640" y2="407" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches start small" x="648" y="440">PutForce</text>
  <line class="flow requests" x1="590" y1="527" x2="590" y2="578" marker-end="url(#arrow-requests)"/>
  <text class="flow-label requests end small" x="582" y="557">GetBatch(batchID)</text>
  <line class="flow batches" x1="640" y1="578" x2="640" y2="527" marker-end="url(#arrow-batches)"/>
  <text class="flow-label batches start small" x="648" y="557">batch</text>
</svg>
